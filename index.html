<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bonus - Sodda Versiya</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #000428 0%, #004e92 100%);
            color: #fff; 
            font-family: 'Courier New', monospace; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            touch-action: none;
        }
        
        #menu { 
            position: absolute; 
            z-index: 100; 
            background: rgba(0, 0, 0, 0.95); 
            padding: 30px; 
            border-radius: 20px; 
            border: 3px solid #00ffaa;
            box-shadow: 0 0 40px rgba(0, 255, 170, 0.5);
            text-align: center;
            max-width: 90%;
            width: 400px;
        }
        
        .title { 
            font-size: 36px; 
            color: #00ffaa; 
            text-shadow: 0 0 20px #00ffaa;
            margin-bottom: 20px;
        }
        
        .stats {
            background: rgba(0, 100, 150, 0.3);
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            border: 2px solid #0088cc;
            font-size: 18px;
        }
        
        .stat-row {
            margin: 10px 0;
        }
        
        .btn {
            background: linear-gradient(135deg, #00ffaa 0%, #00cc88 100%);
            border: none;
            color: #000;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
            width: calc(100% - 20px);
            transition: all 0.3s;
            font-family: 'Courier New', monospace;
        }
        
        .btn:hover { 
            transform: scale(1.05); 
            box-shadow: 0 0 25px rgba(0, 255, 170, 0.8);
        }
        
        #game-ui { 
            position: absolute; 
            top: 15px; 
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 22px; 
            color: #00ffaa; 
            text-shadow: 0 0 15px #00ffaa; 
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
        }
        
        canvas { 
            background: #050505; 
            border: 5px solid #00ffaa; 
            box-shadow: 0 0 50px rgba(0, 255, 170, 0.3);
            border-radius: 10px;
        }
        
        .tap-msg { 
            position: absolute; 
            bottom: 30px; 
            color: #00ffaa; 
            font-size: 18px; 
            animation: blink 1.5s infinite;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 25px;
            border-radius: 20px;
        }
        
        @keyframes blink { 
            0%, 100% { opacity: 1; } 
            50% { opacity: 0.3; } 
        }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<!-- Menu -->
<div id="menu">
    <div class="title">🎮 BONUS</div>
    <div class="stats">
        <div class="stat-row">💰 Coins: <span id="total-coins">0</span></div>
        <div class="stat-row">🏆 Rekord: <span id="high-score">0</span></div>
    </div>
    <button class="btn" onclick="startGame()">▶ BOSHLASH</button>
</div>

<!-- Game UI -->
<div id="game-ui" class="hidden">
    <div>💰 <span id="score">0</span></div>
    <div>❤️ <span id="lives">3</span></div>
</div>

<canvas id="gameCanvas" class="hidden"></canvas>
<div class="tap-msg hidden" id="tap-msg">⬆️⬇️ BOSING</div>

<script>
// O'yin holati
let totalCoins = parseInt(localStorage.getItem('totalCoins')) || 0;
let highScore = parseInt(localStorage.getItem('highScore')) || 0;

// Canvas
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = Math.min(window.innerWidth - 20, 400);
canvas.height = 400;

let score = 0;
let lives = 3;
let gameActive = false;

const player = { 
    x: 50, 
    y: 360, 
    w: 30, 
    h: 30, 
    targetY: 360, 
    color: '#00ff00' 
};

let items = [];
let particles = [];

// Menyu yangilash
updateMenu();

function updateMenu() {
    document.getElementById('total-coins').innerText = totalCoins;
    document.getElementById('high-score').innerText = highScore;
}

function saveGame() {
    localStorage.setItem('totalCoins', totalCoins);
    localStorage.setItem('highScore', highScore);
}

function startGame() {
    // Menyuni yashirish
    document.getElementById('menu').classList.add('hidden');
    document.getElementById('game-ui').classList.remove('hidden');
    canvas.classList.remove('hidden');
    document.getElementById('tap-msg').classList.remove('hidden');
    
    // O'yinni boshlash
    score = 0;
    lives = 3;
    gameActive = true;
    items = [];
    particles = [];
    player.y = 360;
    player.targetY = 360;
    
    document.getElementById('score').innerText = 0;
    document.getElementById('lives').innerText = 3;
    
    draw();
}

// Gravitatsiyani o'zgartirish
function switchGravity() {
    if (!gameActive) return;
    player.targetY = player.targetY === 360 ? 5 : 360;
}

window.addEventListener('mousedown', switchGravity);
window.addEventListener('touchstart', (e) => { 
    e.preventDefault(); 
    switchGravity(); 
});

// Elementlar yaratish
function spawnItem() {
    if (Math.random() < 0.04) {
        const type = Math.random() > 0.4 ? 'coin' : 'obstacle';
        items.push({
            x: canvas.width + 50,
            y: Math.random() * (canvas.height - 100) + 50,
            w: 20, 
            h: 20,
            type: type,
            speed: 4 + Math.random() * 2
        });
    }
}

// Zarralar effekti
function createParticles(x, y, color) {
    for (let i = 0; i < 6; i++) {
        particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6,
            life: 20,
            color: color
        });
    }
}

// O'yinni yangilash
function update() {
    if (!gameActive) return;

    // O'yinchini harakatlantirish
    player.y += (player.targetY - player.y) * 0.15;

    // Elementlarni harakatlantirish
    items.forEach((item, i) => {
        item.x -= item.speed;

        // To'qnashuv tekshirish
        if (player.x < item.x + item.w && 
            player.x + player.w > item.x &&
            player.y < item.y + item.h && 
            player.y + player.h > item.y) {
            
            if (item.type === 'coin') {
                score += 1;
                totalCoins += 1;
                document.getElementById('score').innerText = score;
                items.splice(i, 1);
                createParticles(item.x, item.y, '#ffdd00');
            } else {
                lives--;
                document.getElementById('lives').innerText = lives;
                items.splice(i, 1);
                createParticles(item.x, item.y, '#ff0055');
                
                if (lives <= 0) {
                    gameOver();
                }
            }
        }

        // Ekrandan chiqgan elementlarni o'chirish
        if (item.x < -50) items.splice(i, 1);
    });

    // Zarralarni yangilash
    particles.forEach((p, i) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    });
}

// Chizish
function draw() {
    if (!gameActive) return;

    // Fon
    ctx.fillStyle = 'rgba(5, 5, 5, 0.3)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Grid
    ctx.strokeStyle = '#0a0a0a'; 
    ctx.lineWidth = 1;
    for(let i = 0; i < canvas.width; i += 30) { 
        ctx.beginPath(); 
        ctx.moveTo(i, 0); 
        ctx.lineTo(i, canvas.height); 
        ctx.stroke(); 
    }

    // Zarralar
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / 20;
        ctx.fillRect(p.x, p.y, 3, 3);
    });
    ctx.globalAlpha = 1;

    // O'yinchi
    ctx.shadowBlur = 20; 
    ctx.shadowColor = player.color;
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.w, player.h);
    ctx.shadowBlur = 0;

    // Elementlar
    items.forEach(item => {
        if (item.type === 'coin') {
            ctx.fillStyle = '#ffdd00'; 
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ffdd00';
            ctx.beginPath(); 
            ctx.arc(item.x + 10, item.y + 10, 10, 0, Math.PI * 2); 
            ctx.fill();
        } else {
            ctx.fillStyle = '#ff0055'; 
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff0055';
            ctx.fillRect(item.x, item.y, 20, 20);
        }
    });
    ctx.shadowBlur = 0;

    update();
    spawnItem();
    requestAnimationFrame(draw);
}

// O'yin tugashi
function gameOver() {
    gameActive = false;
    
    if (score > highScore) {
        highScore = score;
    }
    
    saveGame();
    
    setTimeout(() => {
        alert(`🎮 O'YIN TUGADI!\n\n💰 Siz ${score} coin yig'dingiz!\n🏆 Rekord: ${highScore}\n💎 Jami: ${totalCoins} coins`);
        
        document.getElementById('game-ui').classList.add('hidden');
        canvas.classList.add('hidden');
        document.getElementById('tap-msg').classList.add('hidden');
        document.getElementById('menu').classList.remove('hidden');
        
        updateMenu();
    }, 100);
}
</script>
</body>
</html>

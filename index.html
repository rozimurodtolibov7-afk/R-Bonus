<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bonus</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #000428 0%, #004e92 100%);
            color: #fff; 
            font-family: 'Courier New', monospace; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            touch-action: none;
        }
        
        #main-menu, #shop-menu { 
            position: absolute; 
            z-index: 100; 
            background: rgba(0, 0, 0, 0.95); 
            padding: 30px; 
            border-radius: 20px; 
            border: 3px solid #00ffaa;
            box-shadow: 0 0 40px rgba(0, 255, 170, 0.5);
            text-align: center;
            max-width: 90%;
            width: 400px;
        }
        
        .menu-title { 
            font-size: 32px; 
            color: #00ffaa; 
            text-shadow: 0 0 20px #00ffaa;
            margin-bottom: 20px;
            animation: glow 2s infinite;
        }
        
        @keyframes glow {
            0%, 100% { text-shadow: 0 0 20px #00ffaa; }
            50% { text-shadow: 0 0 35px #00ffaa, 0 0 50px #00ffaa; }
        }
        
        .btn {
            background: linear-gradient(135deg, #00ffaa 0%, #00cc88 100%);
            border: none;
            color: #000;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
            width: calc(100% - 20px);
            transition: all 0.3s;
            font-family: 'Courier New', monospace;
        }
        
        .btn:hover { 
            transform: scale(1.05); 
            box-shadow: 0 0 25px rgba(0, 255, 170, 0.8);
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #444 0%, #222 100%);
            color: #00ffaa;
        }
        
        .stats {
            background: rgba(0, 100, 150, 0.3);
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            border: 2px solid #0088cc;
        }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 16px;
        }
        
        .stat-label { color: #aaa; }
        .stat-value { color: #00ffaa; font-weight: bold; }
        
        #game-ui { 
            position: absolute; 
            top: 15px; 
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 20px; 
            color: #00ffaa; 
            text-shadow: 0 0 15px #00ffaa; 
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 10px;
        }
        
        canvas { 
            background: #050505; 
            border: 5px solid #00ffaa; 
            box-shadow: 0 0 50px rgba(0, 255, 170, 0.3);
            border-radius: 10px;
        }
        
        .tap-msg { 
            position: absolute; 
            bottom: 30px; 
            color: #00ffaa; 
            font-size: 16px; 
            animation: blink 1.5s infinite;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 20px;
        }
        
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        
        .shop-item {
            background: rgba(0, 50, 100, 0.4);
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            border: 2px solid #0088cc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .shop-item.owned { border-color: #00ffaa; background: rgba(0, 100, 50, 0.3); }
        
        .item-info { text-align: left; flex: 1; }
        .item-name { font-size: 18px; color: #00ffaa; margin-bottom: 5px; }
        .item-desc { font-size: 12px; color: #aaa; }
        .item-price { font-size: 16px; color: #ffdd00; font-weight: bold; }
        
        .btn-buy {
            background: #ffdd00;
            color: #000;
            padding: 8px 20px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        
        .btn-buy:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
        }
        
        .hidden { display: none !important; }
        
        #pause-btn {
            position: absolute;
            top: 80px;
            right: 15px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #00ffaa;
            color: #00ffaa;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            z-index: 10;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>

<!-- Main Menu -->
<div id="main-menu">
    <div class="menu-title">🎮 BONUS</div>
    <div class="stats">
        <div class="stat-row">
            <span class="stat-label">💰 Umumiy Coins:</span>
            <span class="stat-value" id="total-coins">0</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">🏆 Eng Yuqori:</span>
            <span class="stat-value" id="high-score">0</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">👥 Referallar:</span>
            <span class="stat-value" id="referral-count">0</span>
        </div>
    </div>
    <button class="btn" onclick="startGame()">▶ O'YINNI BOSHLASH</button>
    <button class="btn" onclick="showShop()">🛒 DO'KON</button>
    <button class="btn" onclick="shareReferralDirect()">👥 DO'STLARGA ULASHISH</button>
</div>

<!-- Shop Menu -->
<div id="shop-menu" class="hidden">
    <div class="menu-title">🛒 DO'KON</div>
    <div class="stats">
        <div class="stat-row">
            <span class="stat-label">💰 Sizning Coins:</span>
            <span class="stat-value" id="shop-coins">0</span>
        </div>
    </div>
    <div id="shop-items"></div>
    <button class="btn btn-secondary" onclick="closeShop()">◀ ORQAGA</button>
</div>

<!-- Game UI -->
<div id="game-ui" class="hidden">
    <div>
        <span>💰 <span id="score">0</span></span>
    </div>
    <div>
        <span>⚡ Tezlik: <span id="speed-level">1</span>x</span>
    </div>
</div>
<button id="pause-btn" class="hidden" onclick="togglePause()">⏸ PAUZA</button>
<canvas id="gameCanvas" class="hidden"></canvas>
<div class="tap-msg hidden" id="tap-msg">⬆️⬇️ GRAVITATSIYANI O'ZGARTIRISH UCHUN BOSING</div>

<script>
// Game State
let gameState = {
    totalCoins: parseInt(localStorage.getItem('totalCoins')) || 0,
    highScore: parseInt(localStorage.getItem('highScore')) || 0,
    referralCount: parseInt(localStorage.getItem('referralCount')) || 0,
    ownedItems: JSON.parse(localStorage.getItem('ownedItems')) || [],
    currentSkin: localStorage.getItem('currentSkin') || '#00ff00',
    speedMultiplier: parseFloat(localStorage.getItem('speedMultiplier')) || 1,
    shieldActive: false
};

// Shop Items
const shopItems = [
    { id: 'skin1', name: 'Qizil Neon', desc: 'Qizil rangdagi skin', price: 100, type: 'skin', value: '#ff0055' },
    { id: 'skin2', name: 'Oltin Yulduz', desc: 'Oltin rangdagi skin', price: 200, type: 'skin', value: '#ffdd00' },
    { id: 'skin3', name: 'Moviy Elektr', desc: 'Moviy rangdagi skin', price: 150, type: 'skin', value: '#00aaff' },
    { id: 'skin4', name: 'Yashil Klassik', desc: 'Yashil rangdagi skin', price: 50, type: 'skin', value: '#00ff00' },
    { id: 'speed1', name: 'Tezlik +20%', desc: 'O\'yin tezligini oshiradi', price: 300, type: 'upgrade', value: 0.2 },
    { id: 'shield', name: 'Bitta Himoya', desc: '1 marotaba xatoga bardosh beradi', price: 500, type: 'powerup', value: 'shield' }
];

// Canvas Setup
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = Math.min(window.innerWidth - 20, 400);
canvas.height = 400;

let score = 0, gameActive = false, gamePaused = false, musicStarted = false;
let speedLevel = 1;
const player = { x: 50, y: 360, w: 35, h: 35, targetY: 360, color: '#00ff00' };
let items = [];
let particles = [];
const scoreEl = document.getElementById('score');

// Initialize
updateMainMenuStats();
renderShop();

function updateMainMenuStats() {
    document.getElementById('total-coins').innerText = gameState.totalCoins;
    document.getElementById('high-score').innerText = gameState.highScore;
    document.getElementById('referral-count').innerText = gameState.referralCount;
}

function saveGameState() {
    localStorage.setItem('totalCoins', gameState.totalCoins);
    localStorage.setItem('highScore', gameState.highScore);
    localStorage.setItem('referralCount', gameState.referralCount);
    localStorage.setItem('ownedItems', JSON.stringify(gameState.ownedItems));
    localStorage.setItem('currentSkin', gameState.currentSkin);
    localStorage.setItem('speedMultiplier', gameState.speedMultiplier);
}

function startGame() {
    document.getElementById('main-menu').classList.add('hidden');
    document.getElementById('game-ui').classList.remove('hidden');
    document.getElementById('pause-btn').classList.remove('hidden');
    canvas.classList.remove('hidden');
    document.getElementById('tap-msg').classList.remove('hidden');
    
    score = 0;
    speedLevel = 1;
    gameActive = true;
    gamePaused = false;
    items = [];
    particles = [];
    player.y = 360;
    player.targetY = 360;
    
    // Sotib olingan skin va upgradelarni qo'llash
    player.color = gameState.currentSkin || '#00ff00';
    
    document.getElementById('score').innerText = 0;
    document.getElementById('speed-level').innerText = 1;
    
    draw();
}

function showShop() {
    document.getElementById('main-menu').classList.add('hidden');
    document.getElementById('shop-menu').classList.remove('hidden');
    document.getElementById('shop-coins').innerText = gameState.totalCoins;
    renderShop();
}

function closeShop() {
    document.getElementById('shop-menu').classList.add('hidden');
    document.getElementById('main-menu').classList.remove('hidden');
    updateMainMenuStats();
}

function renderShop() {
    const container = document.getElementById('shop-items');
    container.innerHTML = '';
    
    shopItems.forEach(item => {
        const owned = gameState.ownedItems.includes(item.id);
        const div = document.createElement('div');
        div.className = 'shop-item' + (owned ? ' owned' : '');
        div.innerHTML = `
            <div class="item-info">
                <div class="item-name">${item.name}</div>
                <div class="item-desc">${item.desc}</div>
                <div class="item-price">${owned ? '✓ Sotib olingan' : item.price + ' coins'}</div>
            </div>
            ${owned ? '' : `<button class="btn-buy" onclick="buyItem('${item.id}')" ${gameState.totalCoins < item.price ? 'disabled' : ''}>SOTIB OLISH</button>`}
        `;
        container.appendChild(div);
    });
}

function buyItem(itemId) {
    const item = shopItems.find(i => i.id === itemId);
    if (!item || gameState.totalCoins < item.price) return;
    
    gameState.totalCoins -= item.price;
    gameState.ownedItems.push(itemId);
    
    if (item.type === 'skin') {
        gameState.currentSkin = item.value;
        player.color = item.value; // O'yinchining rangini darhol o'zgartirish
    } else if (item.type === 'upgrade') {
        gameState.speedMultiplier += item.value;
    } else if (item.type === 'powerup' && item.value === 'shield') {
        gameState.shieldActive = true; // Shield faollashtirish
    }
    
    saveGameState();
    renderShop();
    document.getElementById('shop-coins').innerText = gameState.totalCoins;
    
    alert(`✅ ${item.name} sotib olindi!`);
}

function shareReferralDirect() {
    const referralLink = 'https://t.me/Rozimurod_AI_Bot';
    const text = `🎮 Bonus o'yiniga qo'shiling!\n\n💰 Referal kod: CYBER2026\n🎁 50 coin bonus oling!`;
    
    const telegramUrl = `https://t.me/share/url?url=${encodeURIComponent(referralLink)}&text=${encodeURIComponent(text)}`;
    
    window.location.href = telegramUrl;
    
    setTimeout(() => {
        gameState.referralCount++;
        gameState.totalCoins += 50;
        saveGameState();
        updateMainMenuStats();
    }, 1000);
}

function togglePause() {
    gamePaused = !gamePaused;
    document.getElementById('pause-btn').innerText = gamePaused ? '▶ DAVOM' : '⏸ PAUZA';
}

// Audio
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSynthDrive() {
    if (musicStarted) return; 
    musicStarted = true;
    setInterval(() => {
        if(!gameActive || gamePaused) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        const notes = [110, 130, 146, 110, 164, 110];
        osc.frequency.setValueAtTime(notes[Math.floor(Date.now()/200)%6], audioCtx.currentTime);
        gain.gain.setValueAtTime(0.015, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    }, 200);
}

function playCollectSound() {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
}

// Controls
const switchGravity = () => {
    if (!gameActive || gamePaused) return;
    playSynthDrive();
    player.targetY = player.targetY === 360 ? 5 : 360;
};

window.addEventListener('mousedown', switchGravity);
window.addEventListener('touchstart', (e) => { e.preventDefault(); switchGravity(); });

function spawnItem() {
    if (Math.random() < 0.035) {
        const type = Math.random() > 0.35 ? 'bonus' : 'trap';
        items.push({
            x: canvas.width + 50,
            y: Math.random() * (canvas.height - 120) + 60,
            w: 20, h: 20,
            type: type,
            speed: (3.5 + Math.random() * 2.5) * gameState.speedMultiplier
        });
    }
}

function createParticles(x, y, color) {
    for (let i = 0; i < 8; i++) {
        particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8,
            life: 20,
            color: color
        });
    }
}

function update() {
    if (!gameActive || gamePaused) return;

    player.y += (player.targetY - player.y) * 0.18;

    if (score > 0 && score % 50 === 0 && speedLevel < 5) {
        speedLevel = Math.floor(score / 50) + 1;
        document.getElementById('speed-level').innerText = speedLevel;
    }

    items.forEach((item, i) => {
        item.x -= item.speed;

        if (player.x < item.x + item.w && player.x + player.w > item.x &&
            player.y < item.y + item.h && player.y + player.h > item.y) {
            
            if (item.type === 'bonus') {
                score += 1;
                gameState.totalCoins += 1;
                scoreEl.innerText = score;
                items.splice(i, 1);
                playCollectSound();
                createParticles(item.x, item.y, '#ffdd00');
                createPulse();
            } else {
                if (gameState.shieldActive) {
                    gameState.shieldActive = false;
                    items.splice(i, 1);
                    createParticles(item.x, item.y, '#00aaff');
                } else {
                    gameOver();
                }
            }
        }

        if (item.x < -50) items.splice(i, 1);
    });

    particles.forEach((p, i) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    });
}

let pulse = 0;
function createPulse() { pulse = 15; }

function draw() {
    if (!gameActive) return;
    if (gamePaused) {
        requestAnimationFrame(draw);
        return;
    }

    ctx.fillStyle = 'rgba(5, 5, 5, 0.4)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (pulse > 0) {
        ctx.strokeStyle = `rgba(0, 255, 170, ${pulse/20})`;
        ctx.lineWidth = pulse/2;
        ctx.strokeRect(5, 5, canvas.width-10, canvas.height-10);
        pulse--;
    }

    ctx.strokeStyle = '#0a0a0a'; 
    ctx.lineWidth = 1;
    for(let i=0; i<canvas.width; i+=30) { 
        ctx.beginPath(); 
        ctx.moveTo(i,0); 
        ctx.lineTo(i,canvas.height); 
        ctx.stroke(); 
    }

    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / 20;
        ctx.fillRect(p.x, p.y, 3, 3);
    });
    ctx.globalAlpha = 1;

    // Shield himoyasi ko'rsatkichi
    ctx.shadowBlur = 20; 
    ctx.shadowColor = player.color;
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.w, player.h);
    
    // Agar shield faol bo'lsa, qo'shimcha effekt
    if (gameState.shieldActive) {
        ctx.strokeStyle = '#00aaff';
        ctx.lineWidth = 3;
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#00aaff';
        ctx.strokeRect(player.x - 3, player.y - 3, player.w + 6, player.h + 6);
    }

    items.forEach(item => {
        if (item.type === 'bonus') {
            ctx.fillStyle = '#ffdd00'; 
            ctx.shadowColor = '#ffdd00';
            ctx.beginPath(); 
            ctx.arc(item.x + 10, item.y + 10, 9, 0, Math.PI*2); 
            ctx.fill();
        } else {
            ctx.fillStyle = '#ff0055'; 
            ctx.shadowColor = '#ff0055';
            ctx.fillRect(item.x, item.y, 20, 20);
        }
    });

    ctx.shadowBlur = 0;
    update();
    spawnItem();
    requestAnimationFrame(draw);
}

function gameOver() {
    gameActive = false;
    
    if (score > gameState.highScore) {
        gameState.highScore = score;
    }
    
    saveGameState();
    
    setTimeout(() => {
        alert(`❌ YUTQAZDINGIZ!\n\n💰 Siz ${score} coin yig'dingiz!\n🏆 Eng yuqori: ${gameState.highScore}\n💎 Jami coins: ${gameState.totalCoins}`);
        
        document.getElementById('game-ui').classList.add('hidden');
        document.getElementById('pause-btn').classList.add('hidden');
        canvas.classList.add('hidden');
        document.getElementById('tap-msg').classList.add('hidden');
        document.getElementById('main-menu').classList.remove('hidden');
        
        updateMainMenuStats();
    }, 100);
}
</script>
</body>
</html>
